packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  '@eslint/js': ^9.39.5
  '@hookform/resolvers': ^3.10.0
  '@tailwindcss/postcss': ^4.3.3
  '@tanstack/react-query': ^5.104.0
  '@types/node': ^24.19.1
  eslint: ^9.39.5
  prettier: ^3.9.9
  react-hook-form: ^7.89.0
  tailwindcss: ^4.3.3
  typescript: ~6.0.3
  vitest: ^4.1.11
  zod: ^3.25.76

catalogs:
  react19:
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    react: ^19.3.0
    react-dom: ^19.3.0

ignoredBuiltDependencies:
  - '@nestjs/core'
  - bcrypt
  - canvas
  - esbuild
  - mongodb-memory-server
  - '@parcel/watcher'
  - unrs-resolver

linkWorkspacePackages: true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'

overrides:
  '@types/minimatch': 5.1.2

publicHoistPattern:
  - '@ianvs/prettier-plugin-sort-imports'
  - prettier-plugin-tailwindcss
